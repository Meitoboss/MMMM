name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The hosted runner has ~14 GB of disk; an Android build needs most of it. Remove tools we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/npm/docs || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm install

      # In a few seconds, and with the NAME of the missing file – instead of failing after a 5 minute build.
      # (Catches a file that was not uploaded, a name imported twice, a typo in a path.)
      - name: Check that every imported file exists
        run: npx tsx --test tests/lint.test.ts

      - name: Bundle the YouTube challenge solver (yt-dlp-ejs)
        run: npm run fetch-solver

      - name: Align native module versions with the installed Expo SDK
        run: npx expo install --fix

      # react-native-track-player 4.1.x does not compile with Kotlin 2.x (RN 0.81 / Expo SDK 54): fix its source before building
      - name: Patch react-native-track-player for Kotlin 2
        run: node scripts/patch-track-player.mjs

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean

      # react-native-track-player 4.x cannot be loaded by React Native's New Architecture on Android ("TurboModule system assumes
      # returnType == void iff the method is synchronous", issue #2489). Android builds use the legacy architecture instead.
      # (iOS keeps the new one – it works there.)
      - name: Use the legacy architecture on Android
        run: |
          if grep -q '^newArchEnabled=' android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=false/' android/gradle.properties
          else
            echo 'newArchEnabled=false' >> android/gradle.properties
          fi
          grep -n 'newArchEnabled' android/gradle.properties

      # A hosted runner has ~7 GB of RAM: keep Gradle small, build one CPU type (all current phones), few parallel jobs.
      - name: Tune Gradle for a small machine
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=2"
            echo "kotlin.daemon.jvmargs=-Xmx1g"
            echo "android.enableJetifier=false"
          } >> android/gradle.properties
          free -h
          nproc
          df -h /

      # The Expo template signs release builds with the debug key, so the APK installs on any phone (sideloading).
      # The output is shown live (tee), so progress is visible and a stop can be located.
      - name: Build the APK
        working-directory: android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace 2>&1 | tee ../gradle.log || {
            echo "=================== COMPILER ERRORS (e: …) ==================="
            grep -E "^e: |error: " ../gradle.log | sed 's#file:///[^ ]*node_modules/#…/node_modules/#' | sort -u | head -40
            echo "=================== GRADLE ==================="
            grep -E "FAILED|What went wrong|Execution failed|Could not resolve|Unresolved reference" ../gradle.log | sort -u | head -30
            echo "=================== MEMORY / DISK ==================="
            free -h
            df -h /
            exit 1
          }

      - name: Collect the APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "No APK produced"; find android/app/build -name '*.apk'; exit 1; }
          cp "$APK" MusicSpace-android.apk
          ls -lh MusicSpace-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MusicSpace-android-apk
          path: MusicSpace-android.apk

      # also when the run is stopped part-way, so the last lines show where it was
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore

      - name: Make the release feed
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx tsx scripts/make-release-feed.ts --only version --notes "$(git log -1 --pretty=%s)"

      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MusicSpace-android.apk
            feed/version.json
